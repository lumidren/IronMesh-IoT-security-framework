# CodeQL: Go (pki, policy, bridge via go.work), Python (services + wire library),
# JavaScript/TypeScript (console), C/C++ (ESP32 protocol core, traced through the host build)
# and Rust (agent-rs, esp32 host crates; build-mode none).
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "45 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Rust analysis needs a CodeQL bundle with Rust support (codeql-action >= v3.29); until
    # Dependabot moves the pin there, a failing Rust leg does not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
            experimental: false
          - language: python
            build-mode: none
            experimental: false
          - language: javascript-typescript
            build-mode: none
            experimental: false
          - language: c-cpp
            build-mode: manual
            experimental: false
          - language: rust
            build-mode: none
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/target/**'
              - 'console/.next-mock/**'
              - '**/tests/**'
              - 'device/esp32/host/fuzz/**'
              - 'device/agent-rs/fuzz/**'
      - name: build the ESP32 C core (host build)
        if: matrix.language == 'c-cpp'
        working-directory: device/esp32/host
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          set -o pipefail
          status=0
          cargo build --locked --workspace --all-targets 2>&1 | tee "${RUNNER_TEMP}/host-build.log" || status=$?
          if [ "${status}" -ne 0 ]; then
            # Surface the C compiler diagnostics (relayed by the cc crate) as annotations.
            grep -oE '[^ ]+\.[ch]:[0-9]+:[0-9]+: (fatal error|error|warning): .*' "${RUNNER_TEMP}/host-build.log" | sort -u | head -40 |
              while IFS= read -r d; do
                f="${d%%:*}"; rest="${d#*:}"; line="${rest%%:*}"
                rel="$(realpath -m --relative-to="${GITHUB_WORKSPACE}" "${f}" 2>/dev/null || echo "${f}")"
                echo "::error file=${rel},line=${line},title=host C build::${d#*: }"
              done
            grep -E "panicked|error(\[|:)" "${RUNNER_TEMP}/host-build.log" | head -10 | sed 's/^/::error title=host build::/'
          fi
          exit "${status}"
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
